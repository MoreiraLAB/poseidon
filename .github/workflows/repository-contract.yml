name: Scientific repository contract

on:
  push:
    branches:
      - main
      - reproducibility-cleanup
  pull_request:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate published repository artefacts
        run: python scripts/repository_self_check.py
